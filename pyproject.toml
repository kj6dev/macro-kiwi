[project]
name = "macro-kiwi"
version = "0.1.0"
description = "Macro Kiwi - Personal MCP server for unified access to multiple generative AI services"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "google-genai>=1.43.0",
    "httpx>=0.28.1",
    "mcp>=1.17.0",
    "pillow>=11.3.0",
    "python-dotenv>=1.1.1",
]

[project.scripts]
macro-kiwi = "macro_kiwi.server:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/macro_kiwi"]

[tool.uv]
package = true
